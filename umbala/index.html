<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Võ Lâm Web - Quản Trị Server</title>
  <link rel="icon" type="image/png" href="../icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4c442">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Admin VLW">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="../icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="../icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="data_catalog.js"></script>

  <style>
    :root {
      --bg: #0b0a08;
      --bg-panel: #141310;
      --bg-panel-alt: #181713;
      --bg-inner: #0a0907;
      --border-dark: #000000;
      --border-mid: #3d3625;
      --border-light: #5d5238;
      --border-gold: #8c7847;
      --gold: #f0d890;
      --gold-bright: #ffeaa7;
      --gold-dim: #a6925e;
      --text: #e8e2cc;
      --text-dim: #9e947d;
      --text-gold: #ffd970;
      --red: #c0392b;
      --green: #48bb78;
      --font-title: 'Cinzel', serif;
      --font-body: 'Be Vietnam Pro', Tahoma, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(93, 82, 56, 0.18) 0%, transparent 65%),
        radial-gradient(circle at 20% 90%, rgba(61, 54, 37, 0.12) 0%, transparent 50%),
        repeating-linear-gradient(45deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 6px);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* SCROLLBAR JX1 */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #080807; }
    ::-webkit-scrollbar-thumb { background: #3d3522; border: 1px solid #000; }
    ::-webkit-scrollbar-thumb:hover { background: #5d5238; }

    /* AUTH OVERLAY JX1 */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 3, 0.96);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-box {
      background: linear-gradient(to bottom, #231f17, #13120d 60%, #0d0c08);
      border: 2px solid #7d6b41;
      box-shadow: inset 0 0 0 1px #000, 0 12px 35px rgba(0,0,0,0.95);
      border-radius: 2px;
      width: 100%;
      max-width: 410px;
      padding: 30px 26px;
      text-align: center;
      position: relative;
    }

    .login-icon {
      font-size: 40px;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 6px #7d6b41);
    }

    .login-box h2 {
      font-family: var(--font-title);
      color: var(--gold);
      font-size: 21px;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-shadow: 1px 1px 2px #000;
    }

    .login-box p {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--gold-dim);
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .input-control {
      width: 100%;
      padding: 10px 12px;
      background: #080807;
      border: 1px solid #453c29;
      color: #ffeaa7;
      font-size: 13.5px;
      font-family: inherit;
      border-radius: 2px;
      box-shadow: inset 0 1px 3px #000;
    }

    .input-control:focus {
      outline: none;
      border-color: #c9a444;
      box-shadow: inset 0 1px 3px #000, 0 0 6px rgba(201, 164, 68, 0.4);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-dim);
      margin-bottom: 20px;
      cursor: pointer;
    }

    .remember-row input {
      accent-color: var(--gold);
      width: 15px;
      height: 15px;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: linear-gradient(to bottom, #5a471f, #281e0b);
      border: 1px solid #b58d34;
      color: #ffeaa7;
      border-radius: 2px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      font-family: var(--font-title);
      box-shadow: inset 0 0 0 1px #000, inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 12px rgba(0,0,0,0.7);
      text-shadow: 0 1px 2px #000;
      transition: all 0.15s ease;
    }

    .btn-login:hover {
      background: linear-gradient(to bottom, #6d5626, #36290e);
      border-color: #ffd768;
      color: #fff;
    }

    .login-err {
      margin-top: 14px;
      font-size: 12px;
      color: #ff8888;
      background: rgba(88, 28, 21, 0.4);
      padding: 8px;
      border-radius: 2px;
      border: 1px solid #8f3224;
      display: none;
    }

    /* HEADER JX1 */
    header {
      background: linear-gradient(to bottom, #2d281e, #161410 70%, #0d0c09);
      border-bottom: 2px solid #635639;
      box-shadow: inset 0 -1px 0 #000, 0 4px 15px rgba(0,0,0,0.7);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 2px;
      border: 1px solid #7d6b41;
      box-shadow: inset 0 0 0 1px #000;
      padding: 2px;
      background: #14130f;
    }

    .brand-title {
      font-family: var(--font-title);
      font-size: 18px;
      font-weight: 800;
      color: #f0d890;
      letter-spacing: 1px;
      text-shadow: 0 0 4px rgba(240, 216, 144, 0.4), 1px 1px 2px #000;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #a89a77;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 2px;
      font-size: 11.5px;
      font-weight: 600;
      background: #141310;
      border: 1px solid #3d3522;
      box-shadow: inset 0 0 0 1px #000;
      color: var(--text);
      white-space: nowrap;
    }

    .badge.green {
      background: rgba(36, 70, 61, 0.45);
      border-color: #4a7566;
      color: #8ae48a;
    }

    .badge.gold {
      background: rgba(84, 65, 27, 0.4);
      border-color: #947731;
      color: #ffd970;
    }

    .btn-header {
      padding: 5px 12px;
      border-radius: 2px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #5a4c33;
      border-top: 1px solid #7a6846;
      background: linear-gradient(to bottom, #322b1f 0%, #211c14 50%, #17130e 52%, #221c13 100%);
      color: #e2d8be;
      box-shadow: inset 0 0 0 1px #000, 0 1px 2px rgba(0,0,0,0.6);
      text-shadow: 0 1px 1px #000;
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .btn-header:hover {
      background: linear-gradient(to bottom, #423929 0%, #2d261b 50%, #1f1913 52%, #2d251a 100%);
      border-color: #7a6846;
      border-top-color: #9c855a;
      color: #ffffff;
    }

    .btn-header.danger {
      border: 1px solid #573f3a;
      border-top: 1px solid #6e4e48;
      background: linear-gradient(to bottom, #302421 0%, #201715 50%, #140e0d 52%, #221815 100%);
      color: #d6c0bb;
    }

    .btn-header.danger:hover {
      background: linear-gradient(to bottom, #3d2c28 0%, #2a1c1a 50%, #1a100e 52%, #2b1c19 100%);
      border-color: #734f48;
      border-top-color: #8c6057;
      color: #ffffff;
    }

    /* NAVIGATION TABS JX1 */
    .tabs-bar {
      background: #0f0e0c;
      border-bottom: 2px solid #4a3f28;
      box-shadow: inset 0 -1px 0 #000;
      display: flex;
      padding: 0 16px;
      gap: 3px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 9px 16px;
      background: #191814;
      border: 1px solid #3d3623;
      border-bottom: none;
      border-radius: 2px 2px 0 0;
      color: #a89e84;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: #f0d890;
      background: #232019;
    }

    .tab-btn.active {
      background: linear-gradient(to bottom, #4a3e20, #241d0c);
      border: 1px solid #a88d40;
      border-bottom: 1px solid #241d0c;
      color: #ffe89e;
      font-weight: 700;
      text-shadow: 0 1px 2px #000;
      box-shadow: inset 0 1px 0 #d4b25a;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* PANELS JX1 (Khung cửa sổ) */
    .grid-2 {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 14px;
    }

    .panel {
      background: #141310;
      border: 2px solid #554a33;
      box-shadow: inset 0 0 0 1px #000, 0 6px 20px rgba(0,0,0,0.85);
      border-radius: 2px;
      padding: 14px 14px;
    }

    .panel-header {
      background: linear-gradient(to bottom, #2c281e, #181611);
      border: 1px solid #5a4e35;
      border-bottom: 2px solid #383020;
      box-shadow: inset 0 1px 0 #7b6d48;
      padding: 7px 10px;
      margin: -14px -14px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-family: var(--font-title);
      font-size: 14.5px;
      color: #f0d890;
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 2px #000;
    }

    /* PLAYER SELECTION LIST JX1 */
    .search-box {
      margin-bottom: 10px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 8px 10px 8px 30px;
      background: #080807;
      border: 1px solid #453c29;
      border-radius: 2px;
      color: #ffeaa7;
      font-size: 12.5px;
      box-shadow: inset 0 1px 3px #000;
    }

    .search-box input:focus {
      outline: none;
      border-color: #c9a444;
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-dim);
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 600px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .player-item {
      background: #141310;
      border: 1px solid #2d281a;
      box-shadow: inset 0 0 0 1px #000;
      border-radius: 2px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.12s ease;
    }

    .player-item:hover {
      background: #1f1c16;
      border-color: #5a4e32;
    }

    .player-item.active {
      background: linear-gradient(to right, #382d12, #1a1508);
      border-color: #b58d34;
      box-shadow: inset 0 0 0 1px #000, inset 0 0 8px rgba(181, 141, 52, 0.25);
    }

    .pi-name {
      font-weight: 700;
      color: #e8e2cc;
      font-size: 13px;
      text-shadow: 1px 1px 1px #000;
    }

    .player-item.active .pi-name {
      color: #ffd970;
    }

    .pi-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .pi-badges {
      text-align: right;
    }

    .badge-lv {
      background: #23221a;
      border: 1px solid #4a4430;
      color: #7ee07e;
      padding: 1px 5px;
      border-radius: 2px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .badge-cs {
      background: #332710;
      border: 1px solid #755b1f;
      color: #ffd970;
      padding: 1px 5px;
      border-radius: 2px;
      font-size: 10.5px;
      font-weight: 700;
      margin-left: 3px;
    }

    /* PLAYER CONTROL HERO BANNER JX1 */
    .player-card {
      background: linear-gradient(to bottom, #231f16, #14120e);
      border: 2px solid #75653e;
      box-shadow: inset 0 0 0 1px #000, 0 4px 12px rgba(0,0,0,0.6);
      border-radius: 2px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pc-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pc-avatar {
      width: 44px;
      height: 44px;
      border-radius: 2px;
      background: #090806;
      border: 1px solid #5a4e32;
      box-shadow: inset 0 0 0 1px #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      filter: drop-shadow(0 0 4px rgba(240, 216, 144, 0.4));
    }

    .pc-name {
      font-size: 16px;
      font-weight: 800;
      color: #ffd970;
      font-family: var(--font-title);
      text-shadow: 1px 1px 2px #000;
    }

    .pc-details {
      display: flex;
      gap: 10px;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 2px;
      flex-wrap: wrap;
    }

    .pc-details b {
      color: #fff;
    }

    /* ACTION SECTIONS JX1 */
    .action-group {
      background: #11100d;
      border: 1px solid #3a3220;
      box-shadow: inset 0 0 0 1px #000;
      border-radius: 2px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .ag-header {
      font-size: 12.5px;
      font-weight: 700;
      color: #f0d890;
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid #282316;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 1px 1px 2px #000;
    }

    .ag-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 7px;
    }

    .ag-row:last-child {
      margin-bottom: 0;
    }

    /* BUTTONS JX1: ĐỒNG BỘ 1 TÔNG MÀU GỖ MUN & ĐỒNG CỔ */
    .btn {
      padding: 6px 12px;
      border-radius: 2px !important;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #5a4c33 !important;
      border-top: 1px solid #7a6846 !important;
      background: linear-gradient(to bottom, #322b1f 0%, #211c14 50%, #17130e 52%, #221c13 100%) !important;
      color: #e2d8be !important;
      box-shadow: inset 0 0 0 1px #000, 0 1px 2px rgba(0,0,0,0.6) !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.1s ease;
      white-space: nowrap;
      text-shadow: 0 1px 1px #000 !important;
    }

    .btn:hover {
      background: linear-gradient(to bottom, #423929 0%, #2d261b 50%, #1f1913 52%, #2d251a 100%) !important;
      border-color: #7a6846 !important;
      border-top-color: #9c855a !important;
      color: #ffffff !important;
    }

    .btn:active {
      background: linear-gradient(to bottom, #17130e 0%, #211c14 100%) !important;
      box-shadow: inset 0 1px 2px #000 !important;
    }

    /* Nút Hoàng Kim (Primary / Điểm nhấn hành động chính) */
    .btn.primary, .btn.on, .btn.gold {
      background: linear-gradient(to bottom, #4e3c1a 0%, #352810 50%, #221a08 52%, #382b11 100%) !important;
      border: 1px solid #947731 !important;
      border-top: 1px solid #b89843 !important;
      color: #ffe699 !important;
      box-shadow: inset 0 0 0 1px #000, 0 1px 2px rgba(0,0,0,0.6) !important;
      font-weight: 700 !important;
    }

    .btn.primary:hover, .btn.on:hover, .btn.gold:hover {
      background: linear-gradient(to bottom, #614b21 0%, #443415 50%, #2c210b 52%, #463616 100%) !important;
      border-color: #b89843 !important;
      border-top-color: #d9b85c !important;
      color: #ffffff !important;
    }

    /* Nút Thu Hồi / Hủy / Xóa: Đồng Sẫm / Tử Sa Cổ Điển (KHÔNG dùng màu đỏ sặc sỡ) */
    .btn.danger, .btn.revoke {
      background: linear-gradient(to bottom, #302421 0%, #201715 50%, #140e0d 52%, #221815 100%) !important;
      border: 1px solid #573f3a !important;
      border-top: 1px solid #6e4e48 !important;
      color: #d6c0bb !important;
      box-shadow: inset 0 0 0 1px #000, 0 1px 2px rgba(0,0,0,0.6) !important;
    }

    .btn.danger:hover, .btn.revoke:hover {
      background: linear-gradient(to bottom, #3d2c28 0%, #2a1c1a 50%, #1a100e 52%, #2b1c19 100%) !important;
      border-color: #734f48 !important;
      border-top-color: #8c6057 !important;
      color: #ffffff !important;
    }

    /* Success / Đồng Bích Cổ Điển (Đồng điệu với tông JX1, không dùng xanh lá hiện đại) */
    .btn.success {
      background: linear-gradient(to bottom, #2b3327 0%, #1c221a 50%, #111610 52%, #1e251b 100%) !important;
      border: 1px solid #4a5944 !important;
      border-top: 1px solid #62755b !important;
      color: #d3ded0 !important;
      box-shadow: inset 0 0 0 1px #000, 0 1px 2px rgba(0,0,0,0.6) !important;
    }

    .btn.success:hover {
      background: linear-gradient(to bottom, #384233 0%, #252e22 50%, #171d15 52%, #273023 100%) !important;
      border-color: #62755b !important;
      border-top-color: #7c9474 !important;
      color: #ffffff !important;
    }

    .btn.danger:hover {
      background: linear-gradient(to bottom, #692119, #330e09) !important;
      border-color: #b84332 !important;
      color: #fff !important;
    }

    /* INPUTS & SELECTS JX1 */
    select.input-sm, input.input-sm {
      padding: 5px 8px;
      background: #080807 !important;
      border: 1px solid #453c29 !important;
      border-radius: 2px !important;
      color: #ffeaa7 !important;
      font-size: 12px;
      box-shadow: inset 0 1px 3px #000 !important;
    }

    select.input-sm:focus, input.input-sm:focus {
      outline: none;
      border-color: #c9a444 !important;
      box-shadow: inset 0 1px 3px #000, 0 0 4px rgba(201, 164, 68, 0.4) !important;
    }

    /* TABLES JX1 */
    .table-container {
      overflow-x: auto;
      border-radius: 2px;
      border: 1px solid #3d3522;
      background: #0a0907;
      box-shadow: inset 0 0 0 1px #000;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: left;
    }

    th {
      background: linear-gradient(to bottom, #2b2518, #18150d);
      color: #f0d890;
      font-weight: 700;
      padding: 8px 12px;

    /* TOAST NOTIFICATION JX1 */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(to bottom, #2c271c, #16140e);
      color: #ffeaa7;
      border: 2px solid #827042;

      font-size: 12.5px;
      font-weight: 600;
      z-index: 10000;
      display: none;
      animation: slideUp 0.2s ease;
      max-width: 90vw;
    }

    @keyframes slideUp {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* RESPONSIVE DESIGN FOR TABLETS & MOBILE */
    .mobile-only {
      display: none !important;
    }

    @media (max-width: 992px) {
      .mobile-only {
        display: flex !important;

      .grid-2 {

        width: 100%;
        justify-content: flex-start;
      }

      .header-right {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .header-badges {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        width: 100%;
      }

      .header-badges .badge {
        width: 100%;
        justify-content: center;
        padding: 5px 4px;
        font-size: 11px;
        text-align: center;
        margin: 0;
        box-sizing: border-box;
      }

      .header-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        width: 100%;
      }

      .header-actions .btn-header {
        width: 100%;
        justify-content: center;
        padding: 6px 8px;
        font-size: 11.5px;
        margin: 0;
        box-sizing: border-box;
      }

      .tabs-bar {
        padding: 0 4px;
        gap: 2px;
        scrollbar-width: none;
      }
      .tabs-bar::-webkit-scrollbar {
        display: none;
      }
      .tab-btn {
        padding: 9px 10px;
        font-size: 11.5px;
        gap: 4px;
        flex: 1 0 auto;
      }

      main {
        padding: 8px 6px 30px;
      }

      .panel {
        padding: 10px 10px;
      }

      .player-list {
        max-height: 190px;
      }

      .player-card {
        padding: 10px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .pc-info {
        gap: 10px;
        width: 100%;
      }

      .pc-avatar {
        width: 40px;
        height: 40px;
        font-size: 22px;
        flex-shrink: 0;
      }

      .pc-name {
        font-size: 15px;

      .pc-details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 3px 8px;

      .player-card .btn.danger {

        justify-content: center;

      .action-group {

      .ag-row {

      .ag-row > label {

      .ag-row > input[type="number"],
      .ag-row > input[type="text"] {

        box-sizing: border-box !important;

      #toast {

        right: 10px;

        max-width: calc(100% - 20px);
        text-align: center;

      }
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authOverlay">
    <div class="login-box">
      <div class="login-icon">👑</div>
      <h2>Võ Lâm Web</h2>
      <p>Quản Trị Server</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Tài khoản Quản trị</label>
          <input type="text" id="loginUser" class="input-control" placeholder="Nhập tài khoản admin..." required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="loginPass" class="input-control" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
        </div>

        <label class="remember-row">
          <input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập trên máy này
        </label>

        <button type="submit" class="btn-login">⚡ XÁC THỰC QUẢN TRỊ</button>

        <div id="loginErr" class="login-err">
          Tài khoản hoặc mật khẩu không chính xác! Vui lòng thử lại.
        </div>
      </form>
    </div>
  </div>

  <div id="adminRoot" style="display:none"></div>

  <script src="crypto-js.min.js"></script>
  <script src="data_catalog.js"></script>
  <script src="admin_payload.js"></script>
  <script>
    "use strict";

    const MAX_ATTEMPTS = 5;
    const LOCKOUT_MS = 60000;

    function getLockUntil() {
      return parseInt(sessionStorage.getItem("umbala_lock_until") || localStorage.getItem("umbala_lock_until") || "0", 10);
    }

    function checkLockout() {
      const now = Date.now();
      const lockUntil = getLockUntil();
      const btn = document.querySelector(".btn-login");
      const err = document.getElementById("loginErr");

      if (lockUntil > now) {
        const remainSec = Math.ceil((lockUntil - now) / 1000);
        if (btn) {
          btn.disabled = true;
          btn.style.opacity = "0.5";
          btn.style.cursor = "not-allowed";
        }
        if (err) {
          err.style.display = "block";
          err.innerHTML = '⚠️ Nhập sai quá ' + MAX_ATTEMPTS + ' lần! Khóa bảo mật trong <b>' + remainSec + 's</b>.';
        }
        setTimeout(checkLockout, 1000);
        return true;
      }

      if (btn) {
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.cursor = "pointer";
      }
      return false;
    }

    function recordFailedAttempt() {
      let failed = parseInt(sessionStorage.getItem("umbala_failed_attempts") || "0", 10) + 1;
      sessionStorage.setItem("umbala_failed_attempts", failed);

      if (failed >= MAX_ATTEMPTS) {
        const lockUntil = Date.now() + LOCKOUT_MS;
        sessionStorage.setItem("umbala_lock_until", lockUntil);
        localStorage.setItem("umbala_lock_until", lockUntil);
        sessionStorage.setItem("umbala_failed_attempts", "0");
        checkLockout();
      } else {
        const err = document.getElementById("loginErr");
        if (err) {
          err.style.display = "block";
          err.innerHTML = 'Tài khoản hoặc mật khẩu không chính xác! (Còn ' + (MAX_ATTEMPTS - failed) + ' lần thử)';
        }
        const passInp = document.getElementById("loginPass");
        if (passInp) {
          passInp.value = "";
          passInp.focus();
        }
      }
    }

    function unlockAdmin(pkg, sessionKey) {
      try {
        const root = document.getElementById("adminRoot");
        root.innerHTML = pkg.html;
        root.style.display = "block";

        const overlay = document.getElementById("authOverlay");
        if (overlay) overlay.remove();

        if (sessionKey) {
          sessionStorage.setItem("umbala_session", sessionKey);
          if (document.getElementById("rememberMe") && document.getElementById("rememberMe").checked) {
            localStorage.setItem("umbala_session", sessionKey);
          }
        }

        // Execute decrypted admin script
        const s = document.createElement("script");
        s.textContent = pkg.js;
        document.body.appendChild(s);

        if (typeof initFirebase === "function") {
          initFirebase();
        }
      } catch (e) {
        console.error("Lỗi nạp Quản Trị:", e);
        alert("Lỗi giải mã giao diện: " + e.message);
      }
    }

    function tryDecrypt(u, p, isAuto) {
      if (checkLockout()) return false;
      if (!u || !p) return false;

      if (!window.UMBALA_ENCRYPTED || typeof CryptoJS === "undefined") {
        if (!isAuto) alert("Dữ liệu đang tải, vui lòng thử lại sau giây lát.");
        return false;
      }

      try {
        const key = u.trim() + ":" + p.trim();
        const decryptedBytes = CryptoJS.AES.decrypt(window.UMBALA_ENCRYPTED, key);
        const decryptedStr = decryptedBytes.toString(CryptoJS.enc.Utf8);

        if (!decryptedStr || !decryptedStr.startsWith("{")) {
          if (!isAuto) recordFailedAttempt();
          return false;
        }

        const pkg = JSON.parse(decryptedStr);
        if (!pkg.html || !pkg.js) {
          if (!isAuto) recordFailedAttempt();
          return false;
        }

        sessionStorage.removeItem("umbala_failed_attempts");
        sessionStorage.removeItem("umbala_lock_until");
        localStorage.removeItem("umbala_lock_until");

        unlockAdmin(pkg, key);
        return true;
      } catch (err) {
        if (!isAuto) recordFailedAttempt();
        return false;
      }
    }

    function handleLogin(e) {
      if (e) e.preventDefault();
      if (checkLockout()) return;
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value.trim();
      tryDecrypt(u, p, false);
    }

    function checkSavedSession() {
      if (checkLockout()) return;
      const saved = sessionStorage.getItem("umbala_session") || localStorage.getItem("umbala_session");
      if (saved && saved.includes(":")) {
        const idx = saved.indexOf(":");
        const u = saved.slice(0, idx);
        const p = saved.slice(idx + 1);
        tryDecrypt(u, p, true);
      }
    }

    // PWA Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('SW reg fail:', err);
        });
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      checkLockout();
      checkSavedSession();
    });
  </script>
</body>
</html>
